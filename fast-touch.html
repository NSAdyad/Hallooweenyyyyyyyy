<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fastest Finger First</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">🎃 HALLOWEEN INTERACTIVE WORLD</a><nav class="navlinks"><a href="vocabulary.html">Vocabulary</a><a href="fast-touch.html">Fastest Finger First</a></nav></div></header><main class="container page"><div class="toolbar"><div><span class="pill">53 realistic picture rounds</span><h1>⚡ Fastest Finger First</h1><p class="lead">Students race to touch first. The first student gets the chance to say the word. Teacher chooses <b>Correct</b> or <b>Wrong</b>. If wrong, the next fastest student gets the chance.</p></div><a class="btn secondary" href="index.html">← Home</a></div><section class="role-choice" id="mode"><button class="card" id="teacher"><div class="icon">👩‍🏫</div><h2>Host Game</h2><p>Start the picture, watch the touch order and award points.</p></button><button class="card" id="student"><div class="icon">📱</div><h2>Join Game</h2><p>Enter the teacher's code and your name.</p></button></section><section id="panel" class="card hidden"></section></main><script>
const WORDS=[['Pumpkin','vocab-01-pumpkin.jpg'],['Jack-o’-lantern','vocab-02-jack-o-lantern.jpg'],['Candle','vocab-03-candle.jpg'],['Lantern','vocab-04-lantern.jpg'],['Broomstick','vocab-05-broomstick.jpg'],['Cauldron','vocab-06-cauldron.jpg'],['Magic wand','vocab-07-magic-wand.jpg'],['Potion','vocab-08-potion.jpg'],['Tombstone','vocab-09-tombstone.jpg'],['Coffin','vocab-10-coffin.jpg'],['Haunted house','vocab-11-haunted-house.jpg'],['Ghost','vocab-12-ghost.jpg'],['Witch','vocab-13-witch.jpg'],['Vampire','vocab-14-vampire.jpg'],['Zombie','vocab-15-zombie.jpg'],['Skeleton','vocab-16-skeleton.jpg'],['Mummy','vocab-17-mummy.jpg'],['Werewolf','vocab-18-werewolf.jpg'],['Frankenstein monster','vocab-19-monster.jpg'],['Devil','vocab-20-devil.jpg'],['Demon','vocab-21-demon.jpg'],['Bat','vocab-22-bat.jpg'],['Spider','vocab-23-spider.jpg'],['Spider web','vocab-24-spider-web.jpg'],['Owl','vocab-25-owl.jpg'],['Raven','vocab-26-raven.jpg'],['Rat','vocab-27-rat.jpg'],['Wolf','vocab-28-wolf.jpg'],['Full moon','vocab-29-full-moon.jpg'],['Shadow','vocab-30-shadow.jpg'],['Bonfire','vocab-31-bonfire.jpg'],['Scarecrow','vocab-32-scarecrow.jpg'],['Skull','vocab-33-skull.jpg'],['Bones','vocab-34-bones.jpg'],['Witch hat','vocab-35-witch-hat.jpg'],['Mask','vocab-36-mask.jpg'],['Cape','vocab-37-cape.jpg'],['Fangs','vocab-38-fangs.jpg'],['Horns','vocab-39-horns.jpg'],['Claws','vocab-40-claws.jpg'],['Wings','vocab-41-wings.jpg'],['Tail','vocab-42-tail.jpg'],['Costume','vocab-43-costume.jpg'],['Caramel apple','vocab-44-caramel-apple.jpg'],['Candy corn','vocab-45-candy-corn.jpg'],['Sweets','vocab-46-sweets.jpg'],['Chocolate','vocab-47-chocolate.jpg'],['Lollipop','vocab-48-lollipop.jpg'],['Jelly beans','vocab-49-jelly-beans.jpg'],['Marshmallows','vocab-50-marshmallows.jpg'],['Brownie','vocab-51-brownie.jpg'],['Cake','vocab-52-cake.jpg'],['Popcorn','vocab-53-popcorn.jpg']];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let peer=null,hostConns=[],players={},code='',round=0,claims=[],active=false;
function teacher(){ $('mode').classList.add('hidden');$('panel').classList.remove('hidden');$('panel').innerHTML='<div class="center"><h2>👩‍🏫 Host Game</h2><button class="btn" id="create">Create Fastest Finger class</button><div id="host"></div></div>';$('create').onclick=()=>{code=Math.random().toString(36).slice(2,7).toUpperCase();peer=new Peer('fif-'+code.toLowerCase());peer.on('open',()=>{$('host').innerHTML=`<div class="code">${code}</div><p>Students join with this code + their name.</p><p>Connected: <b id="pc">0</b></p><div id="names"></div><button class="btn" id="start" disabled>Start first picture</button><div id="round"></div>`;$('start').onclick=startRound});peer.on('connection',c=>{hostConns.push(c);c.on('data',d=>hostData(c,d));c.on('close',()=>{hostConns=hostConns.filter(x=>x!==c);delete players[c.peer];updateLobby()})})}}
function updateLobby(){if(!$('pc'))return;$('pc').textContent=Object.keys(players).length;$('names').innerHTML=Object.values(players).map(p=>`<span class="pill" style="margin:4px">${esc(p.name)}</span>`).join('');$('start').disabled=Object.keys(players).length===0}
function broadcast(d){hostConns.forEach(c=>{try{c.send(d)}catch(e){}})}
function hostData(c,d){if(d.type==='join'){players[c.peer]={name:d.name,score:0};c.send({type:'joined',code});updateLobby()}if(d.type==='touch'&&active&&!claims.some(x=>x.peer===c.peer)){claims.push({peer:c.peer,name:players[c.peer]?.name||'Student',time:performance.now()});claims.sort((a,b)=>a.time-b.time);broadcast({type:'claims',claims:claims.map((x,i)=>({position:i+1,name:x.name}))});renderTeacher()} }
function startRound(){active=true;claims=[];const [word,img]=WORDS[round];broadcast({type:'round',image:''+img});renderTeacher()}
function renderTeacher(){const [word,img]=WORDS[round];$('round').innerHTML=`<div class="fast-layout" style="margin-top:16px"><div class="card center"><span class="pill">Picture ${round+1} / ${WORDS.length}</span><div class="vocab-photo"><img src="${img}" alt="Vocabulary picture"></div><h2>What is this?</h2><p class="small">The teacher knows the word: <b>${esc(word)}</b></p><div class="actions" style="justify-content:center"><button class="btn" id="correct" disabled>✓ Correct — +10</button><button class="btn danger" id="wrong" disabled>✗ Wrong — next student</button></div><button class="btn secondary" id="nextRound" disabled>Next picture →</button></div><div class="card"><h3>Live touch order</h3><ol class="touch-order" id="claimsList">${claims.length?claims.map((x,i)=>`<li>${i+1}. <b>${esc(x.name)}</b></li>`).join(''):'<li>Waiting for touches…</li>'}</ol><h3>Leaderboard</h3><ol id="board">${boardHTML()}</ol></div></div>`;if(claims.length){$('correct').disabled=false;$('wrong').disabled=false}$('correct').onclick=()=>resolve(true);$('wrong').onclick=()=>resolve(false);$('nextRound').onclick=()=>{round=(round+1)%WORDS.length;startRound()}}
function boardHTML(){return Object.values(players).sort((a,b)=>b.score-a.score).map(p=>`<li>${esc(p.name)} — <b>${p.score}</b> pts</li>`).join('')||'<li>No scores yet.</li>'}
function resolve(correct){if(!claims.length)return;const winner=claims[0];if(correct){players[winner.peer].score+=10;broadcast({type:'result',winner:winner.name,points:10,correct:true});claims=[];active=false;renderTeacher();$('nextRound').disabled=false}else{claims.shift();broadcast({type:'nextChance',claims:claims.map((x,i)=>({position:i+1,name:x.name}))});if(claims.length===0){active=false;renderTeacher();$('nextRound').disabled=false}else renderTeacher()}updateLobby()}
function student(){ $('mode').classList.add('hidden');$('panel').classList.remove('hidden');$('panel').innerHTML='<div class="form"><label>Your name<input id="sn" placeholder="Your name"></label><label>Class code<input id="sc" placeholder="ABC12" maxlength="7"></label><button class="btn" id="join">Join Fastest Finger First</button><p id="status" class="small"></p></div>';$('join').onclick=()=>{const name=$('sn').value.trim(),c=$('sc').value.trim().toUpperCase();if(!name||!c){$('status').textContent='Enter your name and the teacher’s code.';return}peer=new Peer();peer.on('open',()=>{const conn=peer.connect('fif-'+c.toLowerCase());conn.on('open',()=>{conn.send({type:'join',name});renderStudent(conn,name,c)});conn.on('data',d=>studentData(conn,d))})}}
function renderStudent(c,name,cod){$('panel').innerHTML=`<div class="toolbar"><span class="pill">Player: ${esc(name)}</span><span class="code">${esc(cod)}</span></div><div id="sround" class="center"><h2>Waiting for the game to start…</h2></div><div class="card"><h3>Touch order</h3><ol id="sclaims"></ol><h3>Leaderboard</h3><ol id="sboard"></ol></div>`}
let touched=false;function studentData(c,d){if(d.type==='round'){touched=false;$('sround').innerHTML=`<span class="pill">Race!</span><div class="vocab-photo"><img src="${d.image}" alt="Vocabulary picture"></div><button class="btn touch-button" id="touch">👆 TOUCH FIRST</button><p id="ss" class="small">Touch as soon as you know the word.</p>`;$('touch').onclick=()=>{if(touched)return;touched=true;$('touch').disabled=true;c.send({type:'touch'});$('ss').textContent='Touch registered. Wait for your chance.'}}if(d.type==='claims')$('sclaims').innerHTML=d.claims.map(x=>`<li>${x.position}. ${esc(x.name)}</li>`).join('');if(d.type==='nextChance'){$('sclaims').innerHTML=d.claims.map(x=>`<li>${x.position}. ${esc(x.name)}</li>`).join('');$('ss').textContent='The first answer was wrong. The next student now has the chance.'}if(d.type==='result')$('ss').textContent=d.correct?(d.winner===localStorage.getItem('halloweenPlayerName')?'Correct! +10 points.':'Correct answer: '+d.winner):'Next chance.'}
$('teacher').onclick=teacher;$('student').onclick=student;if(location.hash==='#teacher')teacher();if(location.hash==='#student')student();
</script></body></html>
