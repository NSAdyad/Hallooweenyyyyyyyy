<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween History — 12 Approved Slides</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#030b08 url('halloween-background.png') center/cover fixed no-repeat;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(2,12,8,.40),rgba(2,12,8,.55)),url('halloween-background.png') center/cover fixed no-repeat;padding:4.5vh 4vw;box-sizing:border-box}
#slide{max-width:92vw;max-height:88vh;width:auto;height:auto;object-fit:contain;border:2px solid rgba(245,184,61,.35);border-radius:14px;box-shadow:0 25px 80px rgba(0,0,0,.65),0 0 35px rgba(245,184,61,.08)}
button{position:fixed;top:50%;transform:translateY(-50%);z-index:5;width:54px;height:54px;border-radius:50%;border:1px solid #dca54a;background:#071a15e8;color:#f3c66f;font-size:30px;cursor:pointer}
#prev{left:18px}#next{right:18px}
#counter{position:fixed;top:15px;right:18px;z-index:5;color:#f3c66f;background:#071a15e8;border:1px solid #dca54a;border-radius:18px;padding:7px 12px;font:600 13px Arial}
#dots{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:7px;padding:8px 11px;border-radius:20px;background:#071a15e8}
.dot{width:9px;height:9px;border-radius:50%;background:#68756e;cursor:pointer}.dot.active{background:#e5ad52}
#home{position:fixed;top:15px;left:18px;z-index:6;color:#f3c66f;background:#071a15e8;border:1px solid #dca54a;border-radius:18px;padding:8px 13px;text-decoration:none;font:700 13px Arial}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage"><img id="slide" alt=""></div>
<a id="home" href="index.html">← Home</a>
<button id="prev" aria-label="Previous slide">‹</button><button id="next" aria-label="Next slide">›</button>
<div id="counter"></div><div id="dots"></div>
<script>
const slides=[
{src:"01-samhain.jpeg",title:"Samhain"},
{src:"02-christianity-all-saints-day.jpeg",title:"Christianity and All Saints' Day"},
{src:"03-halloween-the-name.jpeg",title:"Halloween – The Name"},
{src:"04-jack-o-lanterns.jpeg",title:"The Legend of Jack-o'-Lanterns"},
{src:"05-pumpkins.jpeg",title:"Pumpkins"},
{src:"06-halloween-celebrations.jpeg",title:"Halloween Celebrations"},
{src:"07-trick-or-treating.jpeg",title:"Trick-or-Treating"},
{src:"08-halloween-events.jpeg",title:"Halloween Events"},
{src:"09-pumpkin-records.jpeg",title:"Pumpkin Records"},
{src:"10-giant-pumpkin-pie.jpeg",title:"2010 World Record Pumpkin Pie"},
{src:"11-most-lit-pumpkins.jpeg",title:"Most Lit Pumpkins"},
{src:"12-fastest-pumpkin-carver.jpeg",title:"Fastest Pumpkin Carver"}
];
let i=0;
const img=document.getElementById("slide"),counter=document.getElementById("counter"),dots=document.getElementById("dots");
slides.forEach((s,n)=>{const d=document.createElement("span");d.className="dot";d.title=s.title;d.onclick=()=>show(n);dots.appendChild(d)});
function show(n){i=(n+slides.length)%slides.length;img.src=slides[i].src;img.alt=slides[i].title;counter.textContent=(i+1)+" / "+slides.length;[...dots.children].forEach((d,k)=>d.classList.toggle("active",k===i))}
document.getElementById("next").onclick=()=>show(i+1);
document.getElementById("prev").onclick=()=>show(i-1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")show(i+1);if(e.key==="ArrowLeft")show(i-1);if(e.key==="Escape")location.href="index.html"});
let x=0;document.addEventListener("touchstart",e=>x=e.touches[0].clientX,{passive:true});document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>50)show(i+(dx<0?1:-1))},{passive:true});
show(0);
</script>

</body>
</html>
