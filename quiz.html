<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spooky Time Quiz</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">🎃 HALLOWEEN INTERACTIVE WORLD</a><nav class="navlinks"><a href="history.html">History</a><a href="vocabulary.html">Vocabulary</a></nav></div></header><main class="container page"><div class="toolbar"><div><span class="pill">15 questions • 30 seconds minimum</span><h1>🎃 Spooky Time Quiz</h1><p class="lead">Questions are in Castellano. Answers are in English. Faster correct answers earn more points.</p></div><a class="btn secondary" href="index.html">← Home</a></div><section class="role-choice" id="mode"><button class="card" id="trial"><div class="icon">🎯</div><h2>Trial — 1 participant</h2><p>Test the quiz alone.</p></button><button class="card" id="host"><div class="icon">🎃</div><h2>Host Game</h2><p>Create the classroom code and control the questions.</p></button><button class="card" id="student"><div class="icon">👻</div><h2>Join Game</h2><p>Enter the teacher's code and your name.</p></button></section><section id="panel" class="card hidden"></section></main><script>
const Q=[
['¿Qué antiguo festival gaélico está relacionado con los orígenes de Halloween?',['Yule','Samhain','Beltane','Saturnalia'],1],
['¿Qué cambio de estación marcaba Samhain?',['Middle of summer','End of winter','End of harvest and start of winter','Start of spring'],2],
['¿Qué significa “hallow” en el nombre Halloween?',['Saint','Harvest','Fire','Spirit'],0],
['¿De qué expresión procede el nombre Halloween?',['All Souls’ Eve','Holy Harvest Night','All Saints’ Morning','All Hallows’ Eve'],3],
['¿Qué verdura se utilizaba tradicionalmente en Irlanda y Escocia para las linternas?',['Potato','Turnip','Carrot','Cabbage'],1],
['Según la leyenda de Stingy Jack, ¿qué llevaba Jack en la oscuridad?',['A candle in a pumpkin','A torch in a lantern','A burning coal in a hollowed turnip','A fire in a cauldron'],2],
['¿Cuándo se celebra All Saints’ Day en el calendario cristiano occidental?',['1 November','31 October','2 November','13 May'],0],
['¿Cómo se llama la noche anterior a All Saints’ Day?',['Saints’ Night','All Souls’ Eve','Harvest Eve','All Hallows’ Eve'],3],
['¿Qué tradiciones ayudaron a desarrollar el moderno trick-or-treating?',['Maypole dancing','Souling and guising','Harvest markets','Carol singing only'],1],
['¿Dónde se registró el récord de giant pumpkin de 1,810.5 lb en 2010?',['New Bremen, Ohio','Boston, Massachusetts','Stillwater, Minnesota','Baltimore, Ohio'],2],
['¿Cuánto pesó el giant pumpkin pie de New Bremen en 2010?',['1,678 kg','821.2 kg','2,819 kg','1,810.5 kg'],0],
['¿Cuántas pumpkins se iluminaron en el récord de Boston de 2007?',['13,280','31,028','20,007','30,128'],3],
['¿Quién consiguió el récord de pumpkin carving de 1 minuto y 14.8 segundos en 2013?',['Jerry Ayers','Steve Clarke','Chris Stevens','Ian Paton'],1],
['¿Qué ocurrió con el récord de giant pumpkin de 2010 en 2025?',['It remained unbeaten','It was replaced by a pie record','It was exceeded by a pumpkin weighing 2,819 lb 4 oz','It was removed'],2],
['¿Cuál de estas es una actividad de Halloween documentada en distintas comunidades?',['Pumpkin carving','Only fireworks','Only indoor dining','Only religious services'],0]
];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer=null;
function fanfare(){} function podium(){}
function score(elapsed){return Math.max(100,1000-Math.floor(elapsed)*20)}
function answerUI(q,on){return `<div class="answers">${q[1].map((x,i)=>`<button class="answer" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(x)}</button>`).join('')}</div>`}
function trial(){let qi=0,total=0,name='Student 1';$('mode').classList.add('hidden');$('panel').classList.remove('hidden');$('panel').innerHTML=`<div class="form"><label>Your name<input id="trialName" value="Student 1"></label><button class="btn" id="begin">Start trial</button></div>`;$('begin').onclick=()=>{name=$('trialName').value.trim()||'Student 1';qi=0;total=0;renderTrial()}}
function renderTrial(){clearInterval(timer);const q=Q[qi];let left=30,answered=false;$('panel').innerHTML=`<div class="toolbar"><span class="pill">Question ${qi+1} / 15</span><span class="timer" id="clock">30</span></div><div class="question">${esc(q[0])}</div><p class="small">Choose one English answer. The selection is completely reset on every question.</p>${answerUI(q)}<div class="actions"><button class="btn secondary" id="celebrate">🎉 Celebration</button><button class="btn" id="next" disabled>Next question</button></div><p id="feedback" class="small"></p>`;$('panel').querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;clearInterval(timer);const elapsed=30-left;$('panel').querySelectorAll('.answer').forEach(x=>x.disabled=true);const i=+b.dataset.i;if(i===q[2]){const pts=score(elapsed);total+=pts;b.classList.add('correct');$('feedback').textContent=`Correct! +${pts} points.`;fanfare()}else{b.classList.add('wrong');$('feedback').textContent=`Not quite. Correct answer: ${q[1][q[2]]}`}$('next').disabled=false;$('next').textContent=qi===14?'Finish quiz':'Next question'});$('celebrate').onclick=fanfare;$('next').onclick=()=>{if(qi<14){qi++;renderTrial()}else{podium();$('panel').innerHTML=`<div class="center"><h2>🏆 Quiz complete</h2><div class="podium"><div class="place first"><span>🏆</span><b>Final score</b><strong>${esc(name)}</strong><em>${total} points</em></div></div><button class="btn" onclick="location.reload()">Play again</button></div>`}};timer=setInterval(()=>{left--;if($('clock'))$('clock').textContent=left;if(left<=0){clearInterval(timer);if(answered)return;answered=true;$('panel').querySelectorAll('.answer').forEach(x=>x.disabled=true);$('feedback').textContent=`Time! Correct answer: ${q[1][q[2]]}`;$('next').disabled=false;$('next').textContent=qi===14?'Finish quiz':'Next question'}},1000)}
let peer=null,hostConn=[],players={},roomCode='',current=0,answers={},hostTimer=null,hostStart=0;
function host(){ $('mode').classList.add('hidden');$('panel').classList.remove('hidden');$('panel').innerHTML='<div class="center"><h2>🎃 Host Game</h2><button class="btn" id="create">Create classroom code</button><div id="hostBox"></div></div>';$('create').onclick=()=>{roomCode=Math.random().toString(36).slice(2,7).toUpperCase();peer=new Peer('hiw-'+roomCode.toLowerCase());peer.on('open',()=>{$('hostBox').innerHTML=`<div class="code">${roomCode}</div><p>Students enter this code + their name.</p><p>Connected students: <b id="connected">0</b></p><div id="plist"></div><button class="btn" id="startQ" disabled>Start quiz</button><div id="hostQ"></div>`;$('startQ').onclick=()=>{current=0;sendQuestion()}});peer.on('connection',c=>{hostConn.push(c);c.on('data',d=>hostData(c,d));c.on('close',()=>{hostConn=hostConn.filter(x=>x!==c);if(players[c.peer])delete players[c.peer];updateLobby()})})}}
function updateLobby(){if(!$('connected'))return;$('connected').textContent=Object.keys(players).length;$('plist').innerHTML=Object.values(players).map(p=>`<span class="pill" style="margin:4px">${esc(p.name)}</span>`).join('');$('startQ').disabled=Object.keys(players).length===0}
function hostData(c,d){if(d.type==='join'){players[c.peer]={name:d.name,score:0,answered:false};c.send({type:'joined',code:roomCode});updateLobby()}if(d.type==='answer'&&players[c.peer]&&d.q===current){players[c.peer].answered=true;players[c.peer].last=d.i;answers[c.peer]=d.i;const elapsed=(Date.now()-hostStart)/1000;if(d.i===Q[current][2])players[c.peer].score+=score(elapsed);broadcastBoard();if(Object.keys(players).length&&Object.values(players).every(p=>p.answered))enableNext(true)}}
function broadcast(msg){hostConn.forEach(c=>{try{c.send(msg)}catch(e){}})}
function broadcastBoard(){broadcast({type:'board',board:Object.values(players).sort((a,b)=>b.score-a.score).map(p=>({name:p.name,score:p.score}))})}
function enableNext(early){if($('nextHost')){$('nextHost').disabled=!early;$('nextHost').textContent=early?'Everyone answered — Next question':'Waiting for all answers…'}}
function sendQuestion(){clearInterval(hostTimer);answers={};Object.values(players).forEach(p=>p.answered=false);hostStart=Date.now();broadcast({type:'question',q:current,text:Q[current][0],options:Q[current][1],time:30});renderHostQuestion();let left=30;hostTimer=setInterval(()=>{left--;if($('hclock'))$('hclock').textContent=left;if(left<=0){clearInterval(hostTimer);enableNext(true);broadcast({type:'lock'})}},1000)}
function renderHostQuestion(){const q=Q[current];$('hostQ').innerHTML=`<div class="card"><div class="toolbar"><span class="pill">Question ${current+1} / 15</span><span class="timer" id="hclock">30</span></div><h2>${esc(q[0])}</h2><p class="small">Correct answer: hidden from students • ${q[1].map((x,i)=>`${String.fromCharCode(65+i)}. ${esc(x)}`).join(' | ')}</p><div class="leader-strip" id="hboard"></div><button class="btn" id="nextHost" disabled>${Object.keys(players).length?'Waiting for all answers…':'Next question'}</button></div>`;$('nextHost').onclick=()=>{if(current<14){current++;sendQuestion()}else{podium();$('hostQ').innerHTML='<div class="center"><h2>🏆 Quiz complete</h2><p>Final leaderboard:</p><div id="finalBoard"></div></div>';broadcast({type:'finish'})}};broadcastBoard()}
function student(){ $('mode').classList.add('hidden');$('panel').classList.remove('hidden');$('panel').innerHTML='<div class="form"><label>Your name<input id="sname" placeholder="Your name"></label><label>Class code<input id="scode" maxlength="7" placeholder="ABC12"></label><button class="btn" id="join">Join quiz</button><p id="joinStatus" class="small"></p></div>';$('join').onclick=()=>{const name=$('sname').value.trim(),code=$('scode').value.trim().toUpperCase();if(!name||!code){$('joinStatus').textContent='Enter your name and the teacher’s code.';return}peer=new Peer();peer.on('open',()=>{const c=peer.connect('hiw-'+code.toLowerCase());c.on('open',()=>{c.send({type:'join',name});renderStudent(c)});c.on('data',d=>studentData(c,d));c.on('error',()=>{$('joinStatus').textContent='Could not connect. Check the class code.'})})}}
function renderStudent(c){$('panel').innerHTML='<div class="toolbar"><span class="pill">Join Game</span><span class="code" id="scodeView"></span></div><div id="sq"></div><div class="card"><h3>Leaderboard</h3><div id="sboard"></div></div>'}
function studentData(c,d){if(d.type==='question'){$('sq').innerHTML=`<div class="toolbar"><span class="pill">Question ${d.q+1} / 15</span><span class="timer" id="sclock">30</span></div><div class="question">${esc(d.text)}</div>${d.options.map((x,i)=>`<button class="answer" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(x)}</button>`).join('')}<p id="smsg" class="small">Select one answer.</p>`;$('sq').querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(b.disabled)return;$('sq').querySelectorAll('.answer').forEach(x=>x.disabled=true);b.classList.add('selected');c.send({type:'answer',q:d.q,i:+b.dataset.i});$('smsg').textContent='Answer sent. Wait for the next question.'})}if(d.type==='lock')$('smsg').textContent='Time is up. Wait for the teacher.';if(d.type==='board')$('sboard').innerHTML=d.board.map((p,i)=>`<p>${i+1}. ${esc(p.name)} — <b>${p.score}</b></p>`).join('');if(d.type==='finish'){podium();$('sq').innerHTML='<h2>🏆 Quiz finished</h2>'}}
$('trial').onclick=trial;$('host').onclick=host;$('student').onclick=student;if(location.hash==='#host')host();if(location.hash==='#student')student();
</script></body></html>
