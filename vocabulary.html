<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Haunted Wordbook</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">🎃 HALLOWEEN INTERACTIVE WORLD</a><nav class="navlinks"><a href="history.html">History</a><a href="vocabulary.html">Vocabulary</a><a href="fast-touch.html">Fastest Finger First</a></nav></div></header><main class="container page"><div class="toolbar"><div><span class="pill">53 slides • realistic local photographs</span><h1>📖 The Haunted Wordbook</h1><p class="lead">Show the picture first. Ask: <b>“What is this?”</b> Students answer aloud. Then reveal the English word.</p></div><a class="btn secondary" href="index.html">← Home</a></div><section class="card vocabulary-stage center"><div class="toolbar"><span class="pill" id="count">1 / 53</span><span class="small">← / → • Space/Enter = reveal</span></div><div class="vocab-photo"><img id="photo" alt=""></div><div id="prompt" class="lead">What is this?</div><div id="vword" class="vocab-word hidden"></div><div class="actions" style="justify-content:center"><button class="btn" id="reveal">Reveal English word</button><button class="btn secondary" id="next">Next slide →</button></div></section></main><script>
const ITEMS=[
['Pumpkin','vocab-01-pumpkin.jpg'],['Jack-o’-lantern','vocab-02-jack-o-lantern.jpg'],['Candle','vocab-03-candle.jpg'],['Lantern','vocab-04-lantern.jpg'],['Broomstick','vocab-05-broomstick.jpg'],['Cauldron','vocab-06-cauldron.jpg'],['Magic wand','vocab-07-magic-wand.jpg'],['Potion','vocab-08-potion.jpg'],['Tombstone','vocab-09-tombstone.jpg'],['Coffin','vocab-10-coffin.jpg'],['Haunted house','vocab-11-haunted-house.jpg'],['Ghost','vocab-12-ghost.jpg'],['Witch','vocab-13-witch.jpg'],['Vampire','vocab-14-vampire.jpg'],['Zombie','vocab-15-zombie.jpg'],['Skeleton','vocab-16-skeleton.jpg'],['Mummy','vocab-17-mummy.jpg'],['Werewolf','vocab-18-werewolf.jpg'],['Frankenstein Monster','vocab-19-frankenstein-monster.jpg'],['Devil','vocab-20-devil.jpg'],['Demon','vocab-21-demon.jpg'],['Bat','vocab-22-bat.jpg'],['Spider','vocab-23-spider.jpg'],['Spider web','vocab-24-spider-web.jpg'],['Owl','vocab-25-owl.jpg'],['Raven','vocab-26-raven.jpg'],['Rat','vocab-27-rat.jpg'],['Wolf','vocab-28-wolf.jpg'],['Full moon','vocab-29-full-moon.jpg'],['Shadow','vocab-30-shadow.jpg'],['Bonfire','vocab-31-bonfire.jpg'],['Scarecrow','vocab-32-scarecrow.jpg'],['Skull','vocab-33-skull.jpg'],['Bones','vocab-34-bones.jpg'],['Witch hat','vocab-35-witch-hat.jpg'],['Mask','vocab-36-mask.jpg'],['Cape','vocab-37-cape.jpg'],['Fangs','vocab-38-fangs.jpg'],['Horns','vocab-39-horns.jpg'],['Claws','vocab-40-claws.jpg'],['Wings','vocab-41-wings.jpg'],['Tail','vocab-42-tail.jpg'],['Costume','vocab-43-costume.jpg'],['Caramel apple','vocab-44-caramel-apple.jpg'],['Candy corn','vocab-45-candy-corn.jpg'],['Sweets','vocab-46-sweets.jpg'],['Chocolate','vocab-47-chocolate.jpg'],['Lollipop','vocab-48-lollipop.jpg'],['Jelly beans','vocab-49-jelly-beans.jpg'],['Marshmallows','vocab-50-marshmallows.jpg'],['Brownie','vocab-51-brownie.jpg'],['Cake','vocab-52-cake.jpg'],['Popcorn','vocab-53-popcorn.jpg']];
let i=0,shown=false;const $=x=>document.getElementById(x);function render(){const [word,file]=ITEMS[i];$('photo').src=''+file;$('photo').alt=word;$('count').textContent=`${i+1} / ${ITEMS.length}`;$('vword').textContent=word;$('vword').classList.toggle('hidden',!shown);$('prompt').textContent=shown?'The word is:':'What is this?';$('reveal').textContent=shown?'Hide word':'Reveal English word'}function next(){i=(i+1)%ITEMS.length;shown=false;render()}$('reveal').onclick=()=>{shown=!shown;render()};$('next').onclick=next;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft'){i=(i-1+ITEMS.length)%ITEMS.length;shown=false;render()}if(e.key==='Enter'||e.key===' '){e.preventDefault();shown=!shown;render()}});render();
</script>
</body></html>
