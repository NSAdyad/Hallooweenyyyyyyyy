<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haunted Restaurant Challenge</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">🎃 HALLOWEEN INTERACTIVE WORLD</a><nav class="navlinks"><a href="restaurant.html">Restaurant Vocabulary</a><a href="restaurant-game.html">Restaurant Game</a><a href="ordering.html">Restaurant Experience</a></nav></div></header><main class="container page"><div class="toolbar"><div><span class="pill">Interactive restaurant vocabulary game</span><h1>🍽️ Haunted Restaurant Challenge</h1><p class="lead">Start a game on the classroom computer, display the code, and let students join this game only when it is time to play.</p></div><a class="btn secondary" href="index.html">← Home</a></div><section id="mode" class="role-choice"><button class="card" id="hostChoice"><div class="icon">🎃</div><h2>Start Game</h2><p>Create a game code and control the round.</p></button><button class="card" id="joinChoice"><div class="icon">👻</div><h2>Join Game</h2><p>Enter the game code and your name.</p></button></section><section id="panel" class="card hidden"></section></main><script>
const rounds=[
 {request:'“I would like a steak, medium-rare, with a side dish and sauce.”',clue:'Choose the food, cooking level and accompaniment.',need:['Steak','Raw','Side dish','Sauce'],pick:4},
 {request:'“I am vegan. I would like something spicy, please.”',clue:'Choose a suitable food style and flavour.',need:['Vegan','Spicy'],pick:2},
 {request:'“Could I have a chicken dish that is cooked in an oven?”',clue:'Identify the food and the cooking method.',need:['Chicken (animal)','Baked'],pick:2},
 {request:'“I want vegetables, but I do not eat meat or fish.”',clue:'Choose the dietary category.',need:['Vegetarian'],pick:1},
 {request:'“I cannot have gluten. What option can you recommend?”',clue:'Identify the relevant dietary requirement.',need:['Gluten-free'],pick:1},
 {request:'“I would like soup and a spoon, please.”',clue:'Choose the dish and the correct utensil.',need:['Soup','Spoon'],pick:2},
 {request:'“I would like a cold drink. I am at the place where drinks are prepared.”',clue:'Think about the restaurant place and service.',need:['Bar','Glass'],pick:2},
 {request:'“Please bring the menu. I want to choose my main course.”',clue:'Identify the restaurant object and service vocabulary.',need:['Menu'],pick:1}
];
const all=['Waiter','Chef','Customer','Restaurant','Kitchen','Bar','Dining Room','Menu','Plate','Soup','Glass','Knife','Fork','Spoon','Cutlery','Beef','Steak','Fillet','Pork','Mutton','Lamb (meat)','Veal','Chicken (animal)','Raw','Grilled','Fried','Baked','Roasted','Boiled','Steamed','Spicy','Sweet','Salty','Vegetarian','Vegan','Gluten-free','Sauce','Side dish'];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let peer=null,conns=[],players={},code='',current=0,host=false;
function showHost(){host=true;$('mode').classList.add('hidden');$('panel').classList.remove('hidden');$('panel').innerHTML='<div class="center"><h2>🎃 Start Restaurant Game</h2><button class="btn" id="create">Create Game Code</button><div id="hostBox"></div></div>';$('create').onclick=createHost}
function createHost(){code=Math.random().toString(36).slice(2,7).toUpperCase();peer=new Peer('hiw-rest-'+code.toLowerCase());peer.on('open',()=>{$('hostBox').innerHTML=`<div class="code">${code}</div><p>Students enter this code and their name.</p><p>Connected players: <b id="pc">0</b></p><div id="names"></div><button class="btn" id="start">Start Round 1</button><div id="hostRound"></div>`;$('start').onclick=startRound});peer.on('connection',c=>{conns.push(c);c.on('data',d=>{if(d.type==='join'){players[c.peer]={name:d.name,score:0};c.send({type:'joined',code});updateHost()}if(d.type==='answer'&&players[c.peer]&&d.q===current){const r=rounds[current];const chosen=d.chosen||[];const correct=r.need.every(x=>chosen.includes(x))&&chosen.length===r.pick;players[c.peer].score+=correct?10:0;c.send({type:'result',correct,answer:r.need});broadcast({type:'board',board:board()});updateHost()}});c.on('close',()=>{delete players[c.peer];updateHost()})})}
function broadcast(d){conns.forEach(c=>{try{c.send(d)}catch(e){}})}
function board(){return Object.values(players).sort((a,b)=>b.score-a.score).map(p=>({name:p.name,score:p.score}))}
function updateHost(){if(!$('pc'))return;$('pc').textContent=Object.keys(players).length;$('names').innerHTML=Object.values(players).map(p=>`<span class="pill">${esc(p.name)}</span>`).join('');}
function startRound(){renderHostRound();broadcast({type:'round',q:current,request:rounds[current].request,clue:rounds[current].clue});}
function renderHostRound(){const r=rounds[current];$('hostRound').innerHTML=`<div class="card" style="margin-top:16px"><div class="toolbar"><span class="pill">Round ${current+1} / ${rounds.length}</span><span class="pill">Game code ${code}</span></div><h2>${r.request}</h2><p class="small">Correct vocabulary: ${r.need.join(' + ')}</p><div class="actions"><button class="btn" id="next" ${current>=rounds.length-1?'disabled':''}>Next Round →</button></div><h3>Leaderboard</h3><ol id="board">${board().map(p=>`<li>${esc(p.name)} — <b>${p.score}</b></li>`).join('')}</ol></div>`;$('next').onclick=()=>{current++;startRound()}}
function showJoin(){host=false;$('mode').classList.add('hidden');$('panel').classList.remove('hidden');$('panel').innerHTML='<div class="form"><label>Your name<input id="name" placeholder="Your name"></label><label>Game code<input id="code" maxlength="8" placeholder="ABC12"></label><button class="btn" id="join">Join Game</button><p id="status" class="small"></p></div>';$('join').onclick=joinGame}
function joinGame(){const name=$('name').value.trim(),c=$('code').value.trim().toUpperCase();if(!name||!c){$('status').textContent='Enter your name and the game code.';return}peer=new Peer();peer.on('open',()=>{const conn=peer.connect('hiw-rest-'+c.toLowerCase());conn.on('open',()=>{conn.send({type:'join',name});renderStudent(conn,name,c)});conn.on('data',d=>studentData(conn,d));conn.on('error',()=>{$('status').textContent='Could not connect. Check the game code.'})})}
function renderStudent(conn,name,c){$('panel').innerHTML=`<div class="toolbar"><span class="pill">${esc(name)}</span><span class="code">${esc(c)}</span></div><div id="sround"><h2>Waiting for the next round…</h2></div><div class="card"><h3>Leaderboard</h3><ol id="sboard"></ol></div>`}
function studentData(conn,d){if(d.type==='round'){$('sround').innerHTML=`<div class="card"><span class="pill">Round ${d.q+1} / ${rounds.length}</span><h2>${esc(d.request)}</h2><p class="small">${esc(d.clue)}</p><h3>Select all the vocabulary words that match the situation.</h3><div class="choice-grid" id="choices"></div><button class="btn" id="submit">Submit</button><p id="feedback" class="small"></p></div>`;const correctSet=rounds[d.q].need;let opts=[...correctSet];while(opts.length<5){const x=all[Math.floor(Math.random()*all.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-0.5);$('choices').innerHTML=opts.map(x=>`<button type="button" class="choice" data-word="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));$('submit').onclick=()=>{const chosen=[...document.querySelectorAll('.choice.selected')].map(b=>b.dataset.word);conn.send({type:'answer',q:d.q,chosen});document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('submit').disabled=true;$('feedback').textContent='Answer submitted. Wait for the result.'}}
if(d.type==='result')$('feedback').textContent=d.correct?'Correct! +10 points.':'Not quite. Review the vocabulary and try the next round.';if(d.type==='board')$('sboard').innerHTML=d.board.map((p,i)=>`<li>${i+1}. ${esc(p.name)} — <b>${p.score}</b></li>`).join('')}
$('hostChoice').onclick=showHost;$('joinChoice').onclick=showJoin;
</script></body></html>
