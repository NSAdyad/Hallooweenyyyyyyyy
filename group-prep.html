<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Role-Play Scenarios</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">🎃 HALLOWEEN INTERACTIVE WORLD</a><nav class="navlinks"><a href="restaurant.html">Restaurant</a><a href="ordering.html">Service Journey</a><a href="group-prep.html">Scenarios</a><a href="roleplay.html">Final Role-Play</a></nav></div></header><main class="container page"><div class="toolbar"><div><span class="pill">10 prepared scenarios</span><h1>👥 Choose Your Restaurant Story</h1><p class="lead">Choose one prepared situation. Decide who is who. Prepare the dialogue and perform the restaurant service sequence. There is no random scenario generator.</p></div><a class="btn secondary" href="index.html">← Home</a></div><section class="scenario-picker" id="scenarios"></section></main><script>
const S=[
['Child’s Birthday','A family comes to the restaurant to celebrate the child’s birthday.','Waiter','Mother','Father','Child'],
['Romantic Dinner','A couple arrives for a romantic Halloween dinner. The waiter must welcome them, explain the menu and provide friendly service.','Waiter','Customer 1','Customer 2'],
['Friends’ Dinner','A group of friends comes to dinner together. They chat, ask questions about the menu, order different dishes and enjoy the evening.','Waiter','Customer 1','Customer 2','Customer 3+'],
['Pain-in-the-Arm Customer','One customer keeps changing their mind, asks many questions and is difficult to satisfy. The waiter must remain polite and professional.','Waiter','Difficult Customer','Customer 2+'],
['Rude Vegan Customer','A very demanding vegan customer checks every ingredient and complains whenever something is not vegan. The waiter must handle the situation professionally.','Waiter','Vegan Customer','Customer 2+'],
['Birthday Surprise','Friends organise a surprise birthday dinner. The waiter knows about the surprise but the birthday guest does not.','Waiter','Birthday Guest','Friend 1','Friend 2+'],
['Wrong Order','A customer receives the wrong dish. The waiter has to listen, apologise, check the order and solve the problem.','Waiter','Customer','Customer 2+'],
['Dietary Request','A customer has a serious dietary requirement and asks detailed questions about ingredients and preparation.','Waiter','Customer with Dietary Request','Customer 2+'],
['Busy Halloween Night','The restaurant is extremely busy. Customers are waiting, the waiter has several tables and everyone must remain polite and organised.','Waiter','Customer 1','Customer 2','Customer 3+'],
['Special Celebration','A group celebrates a special occasion and wants a memorable Halloween meal. The waiter helps them choose dishes and provides excellent service.','Waiter','Host','Guest 1','Guest 2+']
];
document.getElementById('scenarios').innerHTML=S.map((s,i)=>`<article class="card scenario-card"><span class="pill">Scenario ${i+1}</span><h2>${s[0]}</h2><p>${s[1]}</p><p><b>Possible roles:</b> ${s.slice(2).join(' • ')}</p><a class="btn" href="roleplay.html?scenario=${i}">Choose this scenario →</a></article>`).join('');
</script></body></html>
